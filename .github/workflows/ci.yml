name: CI and Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: shellcheck app_calculator.sh
      - name: Unit tests and Blueprint
        run: |
          output=$(bash app_calculator.sh 5 10)
          printf 'Ожидается: Сумма: 15\nПолучено: %s\n' "$output"
          test "$output" = 'Сумма: 15'
          test "$(bash app_calculator.sh -2 5)" = 'Сумма: 3'
          if bash app_calculator.sh 7; then exit 1; fi
          if bash app_calculator.sh abc 1; then exit 1; fi
          echo 'Все тесты пройдены'
          git log --oneline | sha256sum | awk '{print $1}' > lab5_hash.txt
          cat lab5_hash.txt

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build image and verify HTTP
        run: bash scripts/lab6-verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lab6-blueprint
          path: |
            lab6_docker_hash.txt
            lab6_final_hash.txt

  ansible-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible and run lint
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          source "$RUNNER_TEMP/ansible/bin/activate"
          python -m pip install ansible-lint
          ansible-lint ansible_iac/setup_env.yml
      - name: Apply playbook twice and test Nginx
        run: |
          source "$RUNNER_TEMP/ansible/bin/activate"
          bash scripts/lab7-verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lab7-blueprint
          path: lab7_ansible_hash.txt

  compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose specification
        working-directory: monitoring
        run: docker compose config --quiet
      - name: Run Compose and verify monitoring
        run: bash scripts/lab8-verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab8-blueprint
          path: |
            lab8_monitoring_status.txt
            screenshots/

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Deploy, scale, update and roll back
        run: bash scripts/lab9-verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lab9-blueprint
          path: lab9_k8s_status.txt
